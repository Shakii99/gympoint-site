<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090909">
  <title>Password dimenticata | GymPoint</title>
  
<style>
  :root{
    --bg:#090909;
    --panel:#111111;
    --panel-2:#171717;
    --line:#2b2b31;
    --text:#f5f5f7;
    --muted:#9b9ba5;
    --pink:#ff2f68;
    --cyan:#17d7ff;
  }

  *{box-sizing:border-box}

  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}

  body{
    font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:56px 24px 36px;
  }

  .page{
    width:min(100%,740px);
  }

  .hero{
    text-align:center;
    margin-bottom:34px;
  }

  .dumbbell{
    width:78px;
    height:78px;
    margin:0 auto 18px;
    display:grid;
    place-items:center;
  }

  .dumbbell svg{
    width:72px;
    height:72px;
    stroke:var(--pink);
    filter:drop-shadow(0 0 14px rgba(255,47,104,.18));
  }

  .logo{
    margin:0;
    font-weight:950;
    font-size:clamp(54px,10vw,76px);
    line-height:.95;
    letter-spacing:-3px;
  }

  .logo .gym{color:#fff}
  .logo .point{color:var(--pink)}

  .tagline{
    margin-top:20px;
    color:#a2a2ab;
    font-size:clamp(18px,4vw,28px);
    letter-spacing:2px;
  }

  .card{
    border:1px solid #2e2e34;
    border-radius:28px;
    padding:34px 38px 30px;
    background:rgba(17,17,17,.88);
    box-shadow:0 0 0 1px rgba(255,255,255,.01), 0 22px 70px rgba(0,0,0,.35);
  }

  .title{
    margin:0 0 10px;
    font-size:clamp(28px,6vw,40px);
    font-weight:900;
    letter-spacing:-1px;
  }

  .subtitle{
    margin:0 0 28px;
    color:#a4a4ad;
    line-height:1.6;
    font-size:17px;
  }

  label{
    display:block;
    margin:0 0 10px;
    color:#b6b6c0;
    font-size:16px;
    letter-spacing:2px;
    text-transform:uppercase;
  }

  .field{margin-bottom:22px}

  .input-wrap{position:relative}

  input{
    width:100%;
    min-height:72px;
    border-radius:18px;
    border:1px solid #2f2f36;
    background:#1a1a1a;
    color:#fff;
    padding:0 18px;
    font-size:20px;
    outline:none;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.01);
  }

  input::placeholder{color:#70707b}

  input:focus{
    border-color:var(--pink);
    box-shadow:0 0 0 3px rgba(255,47,104,.13);
  }

  .eye{
    position:absolute;
    right:10px;
    top:50%;
    transform:translateY(-50%);
    width:46px;
    height:46px;
    border:0;
    background:transparent;
    color:#a0a0a9;
    font-size:20px;
    cursor:pointer;
  }

  .main-btn{
    width:100%;
    min-height:74px;
    border:0;
    border-radius:18px;
    background:var(--pink);
    color:#fff;
    font-weight:950;
    font-size:24px;
    letter-spacing:2px;
    text-transform:uppercase;
    cursor:pointer;
    box-shadow:0 0 28px rgba(255,47,104,.28), 0 10px 28px rgba(255,47,104,.16);
  }

  .main-btn:disabled{opacity:.58;cursor:not-allowed}

  .small{
    margin-top:24px;
    text-align:center;
    color:#9d9da6;
    font-size:16px;
    line-height:1.65;
  }

  .small a{
    color:var(--cyan);
    text-decoration:none;
  }

  .msg{
    display:none;
    margin-top:18px;
    padding:14px 16px;
    border-radius:15px;
    font-size:15px;
    line-height:1.5;
  }

  .msg.ok{
    display:block;
    color:#d7ffe7;
    border:1px solid rgba(44,210,132,.35);
    background:rgba(44,210,132,.08);
  }

  .msg.bad{
    display:block;
    color:#ffd5dc;
    border:1px solid rgba(255,47,104,.35);
    background:rgba(255,47,104,.08);
  }

  .rules{
    margin:-6px 0 22px;
    color:#8f8f98;
    font-size:14px;
    line-height:1.5;
  }

  @media (max-width:560px){
    body{padding:42px 18px 26px}
    .card{padding:28px 20px 24px;border-radius:24px}
    .logo{font-size:58px}
    .tagline{font-size:18px;letter-spacing:1.6px}
    input{min-height:66px;font-size:18px}
    .main-btn{min-height:68px;font-size:21px}
  }
</style>

</head>
<body>
  <main class="page">
    
<div class="hero">
  <div class="dumbbell" aria-hidden="true">
    <svg viewBox="0 0 64 64" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 22 42 43"/>
      <path d="M15 18 25 28"/>
      <path d="M10 23 20 33"/>
      <path d="M44 31 54 41"/>
      <path d="M39 36 49 46"/>
      <path d="M12 21 8 25a5 5 0 0 0 0 7l3 3"/>
      <path d="M52 43 56 39a5 5 0 0 0 0-7l-3-3"/>
      <path d="M26 15 49 38"/>
      <path d="M15 26 38 49"/>
    </svg>
  </div>
  <h1 class="logo"><span class="gym">GYM</span><span class="point">POINT</span></h1>
  <div class="tagline">Allenati. Sali di livello. Domina.</div>
</div>


    <section class="card">
      <h2 class="title">Password dimenticata?</h2>
      <p class="subtitle">Inserisci l'email associata al tuo account GymPoint. Ti invieremo un link sicuro per impostare una nuova password.</p>

      <form id="forgotForm">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" autocomplete="email" placeholder="tu@email.com" required>
        </div>

        <button id="submitBtn" class="main-btn" type="submit">Invia link</button>
      </form>

      <div id="message" class="msg" role="status" aria-live="polite"></div>

      <div class="small">
        Ricordi la password? Torna nell'app GymPoint.<br>
        <a href="./support.html">Hai bisogno di assistenza?</a>
      </div>
    </section>
  </main>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL = "INSERISCI_SUPABASE_URL";
    const SUPABASE_PUBLISHABLE_KEY = "INSERISCI_SUPABASE_PUBLISHABLE_KEY";
    const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    const form = document.getElementById("forgotForm");
    const emailInput = document.getElementById("email");
    const btn = document.getElementById("submitBtn");
    const message = document.getElementById("message");

    function showMessage(text,type){
      message.textContent=text;
      message.className="msg "+type;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const email=emailInput.value.trim();
      if(!email) return;

      btn.disabled=true;
      btn.textContent="INVIO…";
      message.className="msg";

      try {
        const redirectTo = new URL("./reset-password.html", window.location.href).href;
        const { error } = await supabase.auth.resetPasswordForEmail(email, { redirectTo });
        if(error) throw error;

        showMessage("Se esiste un account associato a questa email, riceverai a breve il link di recupero. Controlla anche Spam o Posta indesiderata.","ok");
        form.reset();
      } catch(error) {
        console.error(error);
        showMessage("Non è stato possibile inviare il link. Riprova tra poco.","bad");
      } finally {
        btn.disabled=false;
        btn.textContent="INVIA LINK";
      }
    });
  </script>
</body>
</html>

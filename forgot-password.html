<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0d12">
<title>Password dimenticata | GymPoint</title>
<style>
:root{--bg:#0b0d12;--card:#151a24;--text:#f5f7fb;--muted:#9fa8b8;--line:#293246;--a:#7a5cff;--a2:#5b3df5;--ok:#36c98f;--bad:#ff6b6b}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 10%,rgba(122,92,255,.22),transparent 32rem),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:24px}.wrap{width:min(100%,470px)}.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}.mark{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-weight:900;background:linear-gradient(145deg,var(--a),var(--a2))}.brand strong{font-size:24px}.card{background:linear-gradient(180deg,#1b2130,#141821);border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:0 22px 70px rgba(0,0,0,.38)}h1{font-size:30px;line-height:1.1;margin:0 0 10px}p{color:var(--muted);line-height:1.6;margin:0 0 22px}label{display:block;font-size:14px;font-weight:700;margin-bottom:8px}input{width:100%;height:52px;border-radius:14px;border:1px solid var(--line);background:#0f131b;color:var(--text);font-size:16px;padding:0 15px;outline:none}input:focus{border-color:var(--a);box-shadow:0 0 0 4px rgba(122,92,255,.14)}button{width:100%;height:52px;border:0;border-radius:14px;margin-top:14px;background:linear-gradient(135deg,var(--a),var(--a2));color:#fff;font-size:16px;font-weight:800;cursor:pointer}button:disabled{opacity:.55}.msg{display:none;margin-top:16px;padding:13px 14px;border-radius:12px;font-size:14px;line-height:1.45}.msg.ok{display:block;color:#c9ffe8;background:rgba(54,201,143,.1);border:1px solid rgba(54,201,143,.3)}.msg.bad{display:block;color:#ffd8d8;background:rgba(255,107,107,.1);border:1px solid rgba(255,107,107,.28)}.small{font-size:13px;color:var(--muted);margin-top:18px}.small a{color:#c8bcff;text-decoration:none}
</style>
</head>
<body><main class="wrap"><div class="brand"><div class="mark">GP</div><strong>GymPoint</strong></div><section class="card">
<h1>Password dimenticata?</h1><p>Inserisci l'indirizzo email del tuo account. Ti invieremo un link sicuro per scegliere una nuova password.</p>
<form id="forgotForm"><label for="email">Email</label><input id="email" type="email" autocomplete="email" placeholder="nome@esempio.it" required><button id="submitBtn" type="submit">Invia link di recupero</button></form>
<div id="message" class="msg" role="status" aria-live="polite"></div><div class="small">Ricordi la password? Torna nell'app GymPoint.<br><a href="./support.html">Hai bisogno di assistenza?</a></div>
</section></main>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
const SUPABASE_URL = "INSERISCI_SUPABASE_URL";
const SUPABASE_PUBLISHABLE_KEY = "INSERISCI_SUPABASE_PUBLISHABLE_KEY";
const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
const form=document.getElementById('forgotForm'), email=document.getElementById('email'), btn=document.getElementById('submitBtn'), msg=document.getElementById('message');
function show(t,k){msg.textContent=t;msg.className='msg '+k}
form.addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;btn.textContent='Invio in corso…';msg.className='msg';try{const redirectTo=new URL('./reset-password.html',location.href).href;const {error}=await supabase.auth.resetPasswordForEmail(email.value.trim(),{redirectTo});if(error)throw error;show('Se esiste un account associato a questa email, riceverai a breve il link per reimpostare la password. Controlla anche Spam o Posta indesiderata.','ok');form.reset()}catch(err){console.error(err);show('Non è stato possibile inviare il link. Riprova tra poco.','bad')}finally{btn.disabled=false;btn.textContent='Invia link di recupero'}});
</script></body></html>

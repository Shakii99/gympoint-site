<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Recupero password - GymPoint</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #09090b;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 24px;
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 18px;
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 28px;
    }

    p {
      color: #a1a1aa;
      line-height: 1.5;
    }

    .button {
      display: block;
      margin-top: 22px;
      padding: 15px;
      border-radius: 12px;
      background: #22c55e;
      color: #fff;
      text-decoration: none;
      font-weight: 800;
    }

    .error {
      color: #ef4444;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>GymPoint</h1>

    <p id="message">
      Verifica del link di recupero...
    </p>

    <a
      id="openApp"
      class="button"
      style="display:none;"
    >
      APRI GYMPOINT
    </a>

  </div>

  <script>
    const message =
      document.getElementById('message');

    const button =
      document.getElementById('openApp');

    const params =
      new URLSearchParams(window.location.search);

    const tokenHash =
      params.get('token_hash');

    const type =
      params.get('type') || 'recovery';

    if (!tokenHash) {

      message.textContent =
        'Il link di recupero è incompleto. Richiedi una nuova email.';

      message.className =
        'error';

    } else {

      /*
       * Non inviamo ancora il token direttamente
       * a GymPoint.
       *
       * Facciamo prima verificare il token a Supabase.
       */
      const supabaseVerifyUrl =
        'https://txlhwnzxvndkybzqsctz.supabase.co/auth/v1/verify' +
        '?token=' + encodeURIComponent(tokenHash) +
        '&type=' + encodeURIComponent(type) +
        '&redirect_to=' +
        encodeURIComponent(
          'gympoint://reset-password'
        );

      button.href =
        supabaseVerifyUrl;

      button.style.display =
        'block';

      message.textContent =
        'Il link è pronto. Premi il pulsante per aprire GymPoint e scegliere una nuova password.';
    }
  </script>

</body>
</html>

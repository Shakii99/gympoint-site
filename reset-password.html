<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0d12">
<title>Nuova password | GymPoint</title>
<style>
:root{--bg:#0b0d12;--text:#f5f7fb;--muted:#9fa8b8;--line:#293246;--a:#7a5cff;--a2:#5b3df5;--ok:#36c98f;--bad:#ff6b6b}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 10%,rgba(122,92,255,.22),transparent 32rem),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:24px}.wrap{width:min(100%,470px)}.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}.mark{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-weight:900;background:linear-gradient(145deg,var(--a),var(--a2))}.brand strong{font-size:24px}.card{background:linear-gradient(180deg,#1b2130,#141821);border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:0 22px 70px rgba(0,0,0,.38)}h1{font-size:30px;line-height:1.1;margin:0 0 10px}p{color:var(--muted);line-height:1.6;margin:0 0 22px}.field{margin-bottom:14px}label{display:block;font-size:14px;font-weight:700;margin-bottom:8px}input{width:100%;height:52px;border-radius:14px;border:1px solid var(--line);background:#0f131b;color:var(--text);font-size:16px;padding:0 15px;outline:none}input:focus{border-color:var(--a);box-shadow:0 0 0 4px rgba(122,92,255,.14)}button.main{width:100%;height:52px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--a),var(--a2));color:white;font-size:16px;font-weight:800;cursor:pointer}.rules,.small{font-size:13px;color:var(--muted);line-height:1.45}.small{margin-top:18px}.small a{color:#c8bcff;text-decoration:none}.msg{display:none;margin-top:16px;padding:13px 14px;border-radius:12px;font-size:14px;line-height:1.45}.msg.ok{display:block;color:#c9ffe8;background:rgba(54,201,143,.1);border:1px solid rgba(54,201,143,.3)}.msg.bad{display:block;color:#ffd8d8;background:rgba(255,107,107,.1);border:1px solid rgba(255,107,107,.28)}#resetForm{display:none}
</style>
</head>
<body><main class="wrap"><div class="brand"><div class="mark">GP</div><strong>GymPoint</strong></div><section class="card">
<h1>Crea una nuova password</h1><p id="intro">Stiamo verificando il link di recupero…</p>
<form id="resetForm"><div class="field"><label for="password">Nuova password</label><input id="password" type="password" autocomplete="new-password" minlength="8" required></div><div class="field"><label for="confirmPassword">Conferma nuova password</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required></div><div class="rules">Usa almeno 8 caratteri. Ti consigliamo una combinazione di lettere, numeri e simboli.</div><button id="submitBtn" class="main" type="submit">Aggiorna password</button></form>
<div id="message" class="msg" role="status" aria-live="polite"></div><div class="small"><a href="./forgot-password.html">Richiedi un nuovo link di recupero</a> · <a href="./support.html">Assistenza GymPoint</a></div>
</section></main>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
const SUPABASE_URL = "INSERISCI_SUPABASE_URL";
const SUPABASE_PUBLISHABLE_KEY = "INSERISCI_SUPABASE_PUBLISHABLE_KEY";
const supabase=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{detectSessionInUrl:true,persistSession:true,autoRefreshToken:true}});
const form=document.getElementById('resetForm'), intro=document.getElementById('intro'), p1=document.getElementById('password'), p2=document.getElementById('confirmPassword'), btn=document.getElementById('submitBtn'), msg=document.getElementById('message');
function show(t,k){msg.textContent=t;msg.className='msg '+k}function ready(){intro.textContent='Inserisci e conferma la nuova password del tuo account GymPoint.';form.style.display='block'}function invalid(){intro.textContent='Questo link di recupero non è valido o è scaduto.';form.style.display='none';show('Richiedi un nuovo link dalla pagina Password dimenticata.','bad')}
const {data:init}=await supabase.auth.getSession();if(init?.session){ready()}else{let resolved=false;const {data:listener}=supabase.auth.onAuthStateChange((event,session)=>{if(resolved)return;if(event==='PASSWORD_RECOVERY'||(event==='SIGNED_IN'&&session)){resolved=true;ready()}});setTimeout(async()=>{if(resolved)return;const {data}=await supabase.auth.getSession();if(data?.session){resolved=true;ready()}else invalid();listener?.subscription?.unsubscribe()},1800)}
form.addEventListener('submit',async e=>{e.preventDefault();msg.className='msg';if(p1.value.length<8){show('La password deve contenere almeno 8 caratteri.','bad');return}if(p1.value!==p2.value){show('Le due password non coincidono.','bad');return}btn.disabled=true;btn.textContent='Aggiornamento…';try{const {error}=await supabase.auth.updateUser({password:p1.value});if(error)throw error;await supabase.auth.signOut();form.style.display='none';intro.textContent='Password aggiornata.';show('La password è stata modificata correttamente. Ora puoi tornare nell’app GymPoint ed effettuare l’accesso.','ok')}catch(err){console.error(err);show('Non è stato possibile aggiornare la password. Il link potrebbe essere scaduto: richiedine uno nuovo.','bad')}finally{btn.disabled=false;btn.textContent='Aggiorna password'}});
</script></body></html>

<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Recupero password - GymPoint</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #09090b;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 24px;

      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 18px;

      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 28px;
    }

    p {
      color: #a1a1aa;
      line-height: 1.5;
    }

    .button {
      display: block;
      margin-top: 22px;
      padding: 15px;

      border-radius: 12px;

      background: #22c55e;
      color: #fff;

      text-decoration: none;
      font-size: 15px;
      font-weight: 800;
    }

    .error {
      color: #ef4444;
    }

    .hint {
      margin-top: 14px;
      color: #71717a;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>GymPoint</h1>

    <p id="message">
      Preparazione del recupero password...
    </p>

    <a
      id="openApp"
      class="button"
      href="#"
      style="display:none;"
    >
      APRI GYMPOINT
    </a>

    <p
      id="hint"
      class="hint"
      style="display:none;"
    >
      Dopo aver premuto il pulsante, conferma
      l'apertura di GymPoint.
    </p>

  </div>

  <script>
    const message =
      document.getElementById('message');

    const button =
      document.getElementById('openApp');

    const hint =
      document.getElementById('hint');

    /*
     * Il token viene passato DIRETTAMENTE
     * dal template email Supabase.
     */
    const params =
      new URLSearchParams(
        window.location.search
      );

    const tokenHash =
      params.get('token_hash');

    const type =
      params.get('type') ||
      'recovery';

    if (!tokenHash) {

      message.textContent =
        'Il link di recupero non contiene il codice necessario. Richiedi una nuova email dalla schermata di login.';

      message.className =
        'error';

    } else {

      /*
       * Passiamo token_hash all'app.
       *
       * reset-password.tsx lo verificherà
       * usando:
       *
       * supabase.auth.verifyOtp({
       *   token_hash,
       *   type: 'recovery'
       * })
       */

      const appParams =
        new URLSearchParams();

      appParams.set(
        'token_hash',
        tokenHash
      );

      appParams.set(
        'type',
        type
      );

      const appUrl =
        'gympoint://reset-password?' +
        appParams.toString();

      button.href =
        appUrl;

      button.style.display =
        'block';

      hint.style.display =
        'block';

      message.textContent =
        'Il link è pronto. Premi il pulsante per aprire GymPoint e scegliere una nuova password.';

      /*
       * NON facciamo redirect automatico.
       *
       * Su iOS l'apertura del custom scheme
       * è più affidabile dopo un tap reale.
       */
    }
  </script>

</body>
</html>

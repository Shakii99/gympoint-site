<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Recupero password - GymPoint</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #09090b;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 24px;

      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 18px;

      text-align: center;
    }

    h1 {
      margin-top: 0;
    }

    p {
      color: #a1a1aa;
      line-height: 1.5;
    }

    .button {
      display: block;
      margin-top: 20px;
      padding: 15px;

      border-radius: 12px;

      background: #22c55e;
      color: #fff;

      text-decoration: none;
      font-weight: bold;
    }

    .error {
      color: #ef4444;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>GymPoint</h1>

    <p id="message">
      Preparazione del recupero password...
    </p>

    <a
      id="openApp"
      class="button"
      href="#"
      style="display:none;"
    >
      APRI GYMPOINT
    </a>
  </div>

  <script>
    const message =
      document.getElementById('message');

    const button =
      document.getElementById('openApp');

    /*
     * Recuperiamo sia i parametri prima di #
     * sia quelli inseriti da Supabase dopo #.
     */
    const query =
      new URLSearchParams(window.location.search);

    const hash =
      new URLSearchParams(
        window.location.hash.replace(/^#/, '')
      );

    const accessToken =
      hash.get('access_token') ||
      query.get('access_token');

    const refreshToken =
      hash.get('refresh_token') ||
      query.get('refresh_token');

    const tokenHash =
      hash.get('token_hash') ||
      query.get('token_hash');

    const code =
      hash.get('code') ||
      query.get('code');

    const type =
      hash.get('type') ||
      query.get('type') ||
      'recovery';

    const error =
      hash.get('error') ||
      query.get('error');

    const errorCode =
      hash.get('error_code') ||
      query.get('error_code');

    const errorDescription =
      hash.get('error_description') ||
      query.get('error_description');

    if (error || errorCode) {
      message.textContent =
        errorDescription ||
        'Il link di recupero non è valido o è scaduto.';

      message.className = 'error';
    } else {
      /*
       * IMPORTANTE:
       * trasformiamo il fragment #...
       * in normali query parameters ?...
       *
       * È questo che ci serve su iPhone.
       */
      const appParams =
        new URLSearchParams();

      if (accessToken) {
        appParams.set(
          'access_token',
          accessToken
        );
      }

      if (refreshToken) {
        appParams.set(
          'refresh_token',
          refreshToken
        );
      }

      if (tokenHash) {
        appParams.set(
          'token_hash',
          tokenHash
        );
      }

      if (code) {
        appParams.set(
          'code',
          code
        );
      }

      appParams.set(
        'type',
        type
      );

      const appUrl =
        'gympoint://reset-password?' +
        appParams.toString();

      if (
        accessToken ||
        tokenHash ||
        code
      ) {
        message.textContent =
          'Il link è stato verificato. Apri GymPoint per scegliere la nuova password.';

        button.href =
          appUrl;

        button.style.display =
          'block';

        /*
         * Proviamo anche ad aprire
         * automaticamente GymPoint.
         */
        setTimeout(() => {
          window.location.href =
            appUrl;
        }, 500);
      } else {
        message.textContent =
          'Il link di recupero non contiene i dati necessari. Richiedi una nuova email.';

        message.className =
          'error';
      }
    }
  </script>
</body>
</html>

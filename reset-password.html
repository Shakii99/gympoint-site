<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Recupero password - GymPoint</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #09090b;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 24px;

      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 18px;

      text-align: center;
    }

    h1 {
      margin-top: 0;
      margin-bottom: 12px;
      font-size: 28px;
    }

    p {
      color: #a1a1aa;
      line-height: 1.5;
      margin: 0;
    }

    .button {
      display: block;
      margin-top: 22px;
      padding: 15px;

      border-radius: 12px;

      background: #22c55e;
      color: #fff;

      text-decoration: none;
      font-weight: bold;
      font-size: 15px;
    }

    .button:active {
      opacity: 0.85;
    }

    .error {
      color: #ef4444;
    }

    .hint {
      margin-top: 14px;
      font-size: 12px;
      color: #71717a;
    }
  </style>
</head>

<body>
  <div class="card">

    <h1>GymPoint</h1>

    <p id="message">
      Preparazione del recupero password...
    </p>

    <a
      id="openApp"
      class="button"
      href="#"
      style="display:none;"
    >
      APRI GYMPOINT
    </a>

    <p
      id="hint"
      class="hint"
      style="display:none;"
    >
      Se GymPoint non si apre, assicurati di avere installato
      l’ultima versione dell’app.
    </p>

  </div>

  <script>
    const message =
      document.getElementById('message');

    const button =
      document.getElementById('openApp');

    const hint =
      document.getElementById('hint');

    /*
     * Recuperiamo sia i parametri normali ?...
     * sia quelli eventualmente presenti dopo #...
     */
    const query =
      new URLSearchParams(window.location.search);

    const hash =
      new URLSearchParams(
        window.location.hash.replace(/^#/, '')
      );

    const accessToken =
      hash.get('access_token') ||
      query.get('access_token');

    const refreshToken =
      hash.get('refresh_token') ||
      query.get('refresh_token');

    const tokenHash =
      hash.get('token_hash') ||
      query.get('token_hash');

    const code =
      hash.get('code') ||
      query.get('code');

    const type =
      hash.get('type') ||
      query.get('type') ||
      'recovery';

    const error =
      hash.get('error') ||
      query.get('error');

    const errorCode =
      hash.get('error_code') ||
      query.get('error_code');

    const errorDescription =
      hash.get('error_description') ||
      query.get('error_description');

    /*
     * Se Supabase ha restituito un errore,
     * lo mostriamo subito.
     */
    if (error || errorCode) {

      message.textContent =
        errorDescription
          ? decodeURIComponent(errorDescription)
          : 'Il link di recupero non è valido o è scaduto.';

      message.className =
        'error';

    } else {

      /*
       * Trasformiamo tutto in query parameters normali,
       * così Expo Router/iOS li leggono più facilmente.
       */
      const appParams =
        new URLSearchParams();

      if (accessToken) {
        appParams.set(
          'access_token',
          accessToken
        );
      }

      if (refreshToken) {
        appParams.set(
          'refresh_token',
          refreshToken
        );
      }

      if (tokenHash) {
        appParams.set(
          'token_hash',
          tokenHash
        );
      }

      if (code) {
        appParams.set(
          'code',
          code
        );
      }

      appParams.set(
        'type',
        type
      );

      const appUrl =
        'gympoint://reset-password?' +
        appParams.toString();

      /*
       * Mostriamo il pulsante solo se abbiamo
       * almeno un dato utile per il recovery.
       */
      if (
        accessToken ||
        tokenHash ||
        code
      ) {

        message.textContent =
          'Il link è stato verificato. Premi il pulsante qui sotto per aprire GymPoint e scegliere la nuova password.';

        button.href =
          appUrl;

        button.style.display =
          'block';

        hint.style.display =
          'block';

        /*
         * IMPORTANTE:
         * niente redirect automatico.
         *
         * L'apertura di gympoint:// avviene
         * solo quando l'utente preme il pulsante.
         *
         * Su iPhone è molto più affidabile.
         */

      } else {

        message.textContent =
          'Il link di recupero non contiene i dati necessari. Richiedi una nuova email dalla schermata di login.';

        message.className =
          'error';
      }
    }
  </script>
</body>
</html>

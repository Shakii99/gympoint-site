<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Reimposta password - GymPoint</title>

  <style>
    body {
      margin: 0;
      background: #09090b;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }

    .card {
      width: 100%;
      max-width: 440px;
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 18px;
      padding: 24px;
      text-align: center;
    }

    h1 {
      margin-top: 0;
      font-size: 24px;
    }

    p {
      color: #a1a1aa;
      line-height: 1.5;
    }

    .button {
      display: block;
      margin-top: 20px;
      padding: 15px;
      background: #22c55e;
      color: white;
      text-decoration: none;
      border-radius: 12px;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>GymPoint</h1>

    <p>
      Stiamo aprendo GymPoint per permetterti di scegliere
      una nuova password.
    </p>

    <a id="openApp" class="button" href="#">
      APRI GYMPOINT
    </a>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);

    const tokenHash = params.get('token_hash');
    const type = params.get('type') || 'recovery';

    if (tokenHash) {
      const appUrl =
        'gympoint://reset-password' +
        '?token_hash=' + encodeURIComponent(tokenHash) +
        '&type=' + encodeURIComponent(type);

      document.getElementById('openApp').href = appUrl;

      setTimeout(() => {
        window.location.href = appUrl;
      }, 500);
    } else {
      document.querySelector('p').textContent =
        'Il link di recupero non è valido o è incompleto.';

      document.getElementById('openApp').style.display = 'none';
    }
  </script>
</body>
</html>
